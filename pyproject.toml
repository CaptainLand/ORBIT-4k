[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-4k"
version = "0.0.1"
description = "Audio-conditioned end-to-end Transformer for osu!mania 4K chart generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "torch>=2.4",
  "torchaudio>=2.4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "rosu-pp-py>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["orbit4k*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
